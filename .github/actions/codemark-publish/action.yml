name: codemark publish
description: Publish a contract release under a Codemark CI key (ENSv2 on Sepolia, row on Arkiv).
inputs:
  publisher:
    description: Publisher name, e.g. acmeswap.eth
    required: true
  key:
    description: Key label whose registry the CI key may register under, e.g. ci-1
    required: true
  component:
    description: Component name, e.g. router
    required: true
  version:
    description: Semver version, e.g. 3.1.0
    required: true
  target:
    description: Deployed contract address on Sepolia
    required: true
  commit:
    description: 40-hex git commit the build came from
    required: false
    default: ${{ github.sha }}
  ci-key:
    description: Private key holding ROLE_REGISTRAR on the key registry (pass a secret)
    required: true
  arkiv-access-key:
    description: Arkiv access key; optional, without it writes use the rate-limited public endpoint
    required: false
    default: ""
  rpc-url:
    description: Sepolia RPC URL
    required: false
    default: https://sepolia.gateway.tenderly.co
outputs:
  name:
    description: The release name
    value: ${{ steps.publish.outputs.name }}
  forward-name:
    description: The forward name a-<12 hex> for the artifact
    value: ${{ steps.publish.outputs.forward-name }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2
    - name: Validate inputs
      shell: bash
      env:
        PUBLISHER: ${{ inputs.publisher }}
        KEY: ${{ inputs.key }}
        COMPONENT: ${{ inputs.component }}
        VERSION: ${{ inputs.version }}
        TARGET: ${{ inputs.target }}
        COMMIT: ${{ inputs.commit }}
      run: |
        label='^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
        [[ "$COMPONENT" =~ $label ]] || { echo "component must match $label" >&2; exit 1; }
        [[ "$KEY" =~ $label ]] || { echo "key must match $label" >&2; exit 1; }
        [[ "$PUBLISHER" =~ ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+eth$ ]] || { echo "publisher must be a lowercase .eth name" >&2; exit 1; }
        [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "version must be <maj>.<min>.<patch>" >&2; exit 1; }
        [[ "$TARGET" =~ ^0x[0-9a-fA-F]{40}$ ]] || { echo "target must be an address" >&2; exit 1; }
        [[ -z "$COMMIT" || "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit must be 40 lowercase hex" >&2; exit 1; }
    - name: Install Codemark
      shell: bash
      working-directory: ${{ github.action_path }}/../../../packages
      run: bun install --frozen-lockfile
    - name: Publish
      id: publish
      shell: bash
      working-directory: ${{ github.action_path }}/../../../packages
      env:
        CODEMARK_CI_KEY: ${{ inputs.ci-key }}
        ARKIV_ACCESS_KEY: ${{ inputs.arkiv-access-key }}
        SEPOLIA_RPC_URL: ${{ inputs.rpc-url }}
        PUBLISHER: ${{ inputs.publisher }}
        KEY: ${{ inputs.key }}
        COMPONENT: ${{ inputs.component }}
        VERSION: ${{ inputs.version }}
        TARGET: ${{ inputs.target }}
        COMMIT: ${{ inputs.commit }}
      run: |
        out="$RUNNER_TEMP/codemark-release.json"
        args=(publish "$PUBLISHER" "$KEY" --component "$COMPONENT" --version "$VERSION" --target "$TARGET")
        if [[ -n "$COMMIT" ]]; then args+=(--commit "$COMMIT"); fi
        bun cli "${args[@]}" > "$out"
        cat "$out"
        echo "name=$(jq -r .name "$out")" >> "$GITHUB_OUTPUT"
        echo "forward-name=$(jq -r .forwardName "$out")" >> "$GITHUB_OUTPUT"
